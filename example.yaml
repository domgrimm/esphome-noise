# Generic example: any ESP32 + I2S speaker, noise select + physical button.
esphome:
  name: noise-demo

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://domgrimm/esphome-noise
    components: [noise]

i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26

speaker:
  platform: i2s_audio
  id: i2s_audio_speaker
  i2s_dout_pin: GPIO22
  dac_type: external

noise:
  id: my_noise
  speaker: i2s_audio_speaker

# Live noise-color picker + a button to toggle it.
select:
  - platform: template
    id: noise_select
    name: "Noise"
    options: ["Off", "White", "Pink", "Brown", "Gray"]
    initial_option: "Off"

button:
  - platform: template
    name: "Toggle Noise"
    on_press:
      - if:
          condition:
            lambda: 'return id(noise_select).state != "Off";'
          then:
            - noise.stop:
                id: my_noise
            - select.set_option:
                id: noise_select
                option: "Off"
          else:
            - noise.start:
                id: my_noise
                variant: white
            - select.set_option:
                id: noise_select
                option: "White"

# Automation to follow the select (switch noise colors live).
automation:
  - trigger:
      - platform: state
        entity_id: select.noise_demo_noise
    action:
      - if:
          condition:
            lambda: 'return id(noise_select).state == "Off";'
          then:
            - noise.stop:
                id: my_noise
          else:
            - noise.start:
                id: my_noise
                variant: !lambda 'return id(noise_select).state.lower();'