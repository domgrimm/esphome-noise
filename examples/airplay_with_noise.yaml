# AirPlay 2 Receiver with Integrated Noise Generator
#
# Demonstrates:
# - Running henriklied/esphome-airplay2 and domgrimm/esphome-noise on the SAME ESP32
# - No pin conflicts: airplay_receiver owns the hardware I2S pins, and esphome-noise
#   directly feeds the AirPlay audio backend
# - True spatial stereo (44.1 kHz, 16-bit stereo PCM)
# - Automatic pause when streaming AirPlay music; automatic smooth resume when AirPlay stops

esphome:
  name: airplay-sound-machine
  friendly_name: "AirPlay Sound Machine"
  min_version: 2025.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  flash_mode: dio
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf

# PSRAM is required for AirPlay 2 ALAC/AAC buffering and HomeKit pairing
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: "MyWiFi"
  password: "MyPassword"

# Plain API (no encryption: key: to prevent libsodium conflict with AirPlay 2)
api:

logger:
  level: INFO

external_components:
  - source: github://henriklied/esphome-airplay2
    components: [airplay_receiver]
  - source: github://domgrimm/esphome-noise
    components: [noise]

# AirPlay 2 receiver controls the hardware I2S pins to the DAC (e.g. PCM5102A or TAS5805M)
airplay_receiver:
  id: airplay
  name: "Living Room Speaker"
  i2s_bclk_pin: 14
  i2s_lrclk_pin: 15
  i2s_dout_pin: 16
  amp_enable_pin: 17
  sample_rate: 44100
  amp_idle_timeout: 60

# Noise machine outputs directly into the AirPlay 2 audio output
noise:
  id: ambient_noise
  airplay_receiver: airplay

  # Entities for Home Assistant control:
  select:
    name: "Noise Sound"
  media_player:
    name: "Noise Machine"
  volume:
    name: "Noise Volume"
  tone:
    name: "Noise Tone"
  sleep_timer:
    name: "Noise Sleep Timer"
