# Generic example: any ESP32 + I2S speaker, auto "Noise" select + physical button.
esphome:
  name: noise-demo

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://domgrimm/esphome-noise
    components: [noise]

i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26

speaker:
  platform: i2s_audio
  id: i2s_audio_speaker
  i2s_dout_pin: GPIO22
  dac_type: external

noise:
  id: my_noise
  speaker: i2s_audio_speaker
  select:
    id: noise_select
    name: Noise

# A physical button toggling the (auto-created) select — starts/stops noise.
button:
  - platform: template
    name: "Toggle Noise"
    on_press:
      - select.next:
          id: noise_select